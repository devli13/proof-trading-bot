# HISTORICAL — this is NOT the deploy path any more. Kept as the record of the
# worker's runtime shape; nothing here is applied.
#
# The persistent multi-bot worker now runs on the fsn1 Hetzner box under Coolify
# (Nixpacks, no Dockerfile: `pnpm install` → `pnpm worker`); the Render service is
# suspended. Deploys go push-to-main → .github/workflows/deploy-fsn1.yml, and both
# the secrets and the non-secret env below live in Coolify's env store. See the
# "Deploy" section of README.md.
#
# Still true off-Render: the tsx/NODE_ENV note below, and the fact that the bot
# roster lives in the Supabase registry (`pnpm bots add ...`) so scaling bots needs
# NO redeploy. Render-specific and dead: the region, the plan, and the
# corepack/EROFS note.
services:
  - type: worker
    name: proof-trading-bot-worker
    runtime: node
    plan: starter
    region: oregon
    autoDeploy: true
    # devDependencies (tsx) are needed at runtime — do not set NODE_ENV=production.
    # pnpm is provisioned by Render from the `packageManager` field (corepack) —
    # do NOT run `corepack enable` here: Render's Node image has a read-only
    # /usr/bin with pnpm already present, so `corepack enable` fails with EROFS.
    buildCommand: pnpm install
    startCommand: pnpm worker
    envVars:
      - key: PROOF_NETWORK
        value: devnet
      - key: PROOF_IMPACT_EVENT
        value: "203"
      - key: TICK_INTERVAL_MS
        value: "3000"
      - key: BOTS_REFRESH_MS
        value: "30000"
      - key: MARKET_CACHE_MS
        value: "60000"
      - key: DB_SCHEMA
        value: proof_bot
      - key: DRY_RUN
        value: "0"
      - key: LOG_LEVEL
        value: info
      # Secrets — were set in the Render dashboard, now in Coolify; never committed:
      - key: DATABASE_URL
        sync: false
      - key: BOTS_ENC_KEY
        sync: false
